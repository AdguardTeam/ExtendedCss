---
version: 2
plan:
  project-key: AJL
  key: EXTCSSSBUILD
  name: extended-css - build

stages:
  - Build:
      manual: false
      final: false
      jobs:
        - Build

Build:
  key: BUILD
  other:
    clean-working-dir: true
  tasks:
    - checkout:
        force-clean-build: true
    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -e
            set -x

            # Fix mixed logs
            exec 2>&1

            docker build \
              --file Dockerfile \
              --progress plain \
              --target build-output \
              --output type=local,dest=output \
              .
    - inject-variables:
        file: output/artifacts/build.txt
        scope: RESULT
        namespace: inject
    # FIXME: VCS tagging disabled temporarily for build verification — re-enable once build is confirmed working
    # - any-task:
    #     plugin-key: com.atlassian.bamboo.plugins.vcs:task.vcs.tagging
    #     configuration:
    #       selectedRepository: defaultRepository
    #       tagName: v${bamboo.inject.version}
  final-tasks:
    - script:
        interpreter: SHELL
        scripts:
          - "./bamboo-specs/scripts/cleanup.sh output/artifacts/extended-css.tgz"
  artifacts:
    - name: extended-css.tgz
      location: output/artifacts
      pattern: extended-css.tgz
      shared: true
      required: true
  requirements:
    - extension: 'true'

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

labels: []

other:
  concurrent-build-plugin: system-default
